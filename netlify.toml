[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"

[functions]
  # nft (Node File Tracing) incluye dist/ sin recompilar con esbuild
  node_bundler = "nft"

# Redirige todas las llamadas a la API a la función serverless
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true
